apiVersion: v1
kind: Service
metadata:
  name: {{ include "ondemand.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ondemand.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    {{- include "ondemand.selectorLabels" . | nindent 4 }}

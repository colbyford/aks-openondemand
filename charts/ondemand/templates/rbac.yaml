apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal-jobs
  namespace: {{ include "ondemand.jobsNamespace" . }}
rules:
  - apiGroups: [""]
    resources: [pods, configmaps, services, secrets]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: connection-discovery
  namespace: {{ include "ondemand.jobsNamespace" . }}
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: connection-discovery
  namespace: {{ include "ondemand.jobsNamespace" . }}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ include "ondemand.jobsNamespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: connection-discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-jobs
  namespace: {{ include "ondemand.jobsNamespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ondemand.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal-jobs
